<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – INSAT XAI RainCast</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body class="auth-body">
    <div class="auth-wrapper">
        <!-- Animated background blobs -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>

        <div class="auth-card">
            <div class="auth-logo">
                <span class="logo-icon">🌩️</span>
                <h1>INSAT-3DR <span>XAI RainCast</span></h1>
            </div>

            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to continue to your dashboard.</p>

            <div id="signin-error" class="auth-alert auth-alert-error" style="display:none;"></div>

            <form id="signin-form" class="auth-form" autocomplete="off">
                <div class="form-group">
                    <label for="signin-email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="signin-email" placeholder="you@example.com" required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="signin-password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="signin-password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-pw" onclick="togglePw('signin-password', this)">👁</button>
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="signin-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader" style="display:none;">⏳</span>
                </button>
            </form>

            <p class="auth-footer-link">
                New user? <a href="/signup">Sign up here</a>
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        // Redirect if already logged in
        if (sessionStorage.getItem('xai_user')) {
            window.location.href = '/';
        }

        document.getElementById('signin-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email    = document.getElementById('signin-email').value.trim().toLowerCase();
            const password = document.getElementById('signin-password').value;
            const errorEl  = document.getElementById('signin-error');
            const btn      = document.getElementById('signin-btn');

            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.querySelector('.btn-text').textContent = 'Signing in…';

            try {
                const res  = await fetch('/api/signin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    // Store the returned user object in session for the dashboard
                    sessionStorage.setItem('xai_user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    showError(errorEl, data.error || 'Sign in failed. Please try again.');
                    btn.disabled = false;
                    btn.querySelector('.btn-text').textContent = 'Sign In';
                }
            } catch (err) {
                showError(errorEl, 'Network error. Please check your connection.');
                btn.disabled = false;
                btn.querySelector('.btn-text').textContent = 'Sign In';
            }
        });
    </script>
</body>

</html>
